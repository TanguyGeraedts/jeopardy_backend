spring:
  application:
    name: jeopardy
  datasource:
    url: jdbc:postgresql://localhost:5432/jeopardy
    username: jeopardy
    password: jeopardy_password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

# Only /actuator/health is public (SecurityConfig); nothing else is exposed.
management:
  endpoints:
    web:
      exposure:
        include: health

app:
  lobby:
    base-url: http://localhost:3100
    launch-url: http://localhost:3000/play/{gameSessionId}
    public-key-location: file:./secrets/lobby-public.pem
    game-name: ${LOBBY_GAME_NAME:Jeopardy}
    game-banner: ${LOBBY_GAME_BANNER:https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfg_368UuXqIhyTUzBLq3h9ijRTR8MXn6gYn06dVssSUMHWxsoy6t_G1ZS&s=10}
    background-color: ${LOBBY_BACKGROUND_COLOR:#060b2e}
    background-image: ${LOBBY_BACKGROUND_IMAGE:https://assets-prd.ignimgs.com/2022/07/15/jeopardy-1657926877160.png}
  security:
    clerk:
      issuer: ${CLERK_ISSUER:https://adjusted-cicada-6273.clerk.accounts.dev}
      authorized-parties: ${CLERK_AUTHORIZED_PARTIES:http://localhost:3000}
    # Account deletions: Clerk dashboard > Configure > Webhooks, endpoint <site>/api/public/webhooks/clerk with the
    # user.deleted event; its "Signing secret" (whsec_...) goes here. Unset = webhooks are rejected.
    clerk-webhook:
      signing-secret: ${CLERK_WEBHOOK_SIGNING_SECRET:}
  gameplay:
    # Games (players' names, teams, scores) are deleted this long after they were created. The privacy notice
    # promises 30 days: change both together.
    session-retention: 30d
    session-cleanup-cron: "0 30 3 * * *"
