spring:
  application:
    name: jeopardy
  datasource:
    url: jdbc:postgresql://localhost:5432/jeopardy
    username: jeopardy
    password: jeopardy_password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  management:
    endpoints:
      web:
        exposure:
          include: health

app:
  lobby:
    base-url: http://localhost:3100
    launch-url: http://localhost:3000/play/{gameSessionId}
    public-key-location: file:./secrets/lobby-public.pem
  security:
    # Host logins: your Clerk DEVELOPMENT instance (keys pk_test_/sk_test_). Not a secret: it's the public
    # Frontend API URL from the Clerk dashboard (Configure > API keys). Production overrides it (application-prod.yaml).
    clerk:
      issuer: ${CLERK_ISSUER:https://adjusted-cicada-6273.clerk.accounts.dev}
      authorized-parties: ${CLERK_AUTHORIZED_PARTIES:http://localhost:3000}
