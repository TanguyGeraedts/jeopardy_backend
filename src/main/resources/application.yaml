# resources/application.yaml  (changed: lobby public key)
spring:
  application:
    name: jeopardy
  datasource:
    url: jdbc:postgresql://localhost:5432/jeopardy
    username: jeopardy
    password: jeopardy_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  management:
    endpoints:
      web:
        exposure:
          include: health

app:
  lobby:
    base-url: http://localhost:3100
    launch-url: http://localhost:3100/play/{gameSessionId}
    public-key-location: file:./secrets/lobby-public.pem