# Server settings: everything comes from environment variables (see the Dockerfile).
app:
  lobby:
    base-url: ${LOBBY_BASE_URL}                     # e.g. https://api.lobby.geraedts.dev  (or http://lobby-backend:8080 inside docker)
    launch-url: ${JEOPARDY_PUBLIC_URL}/play/{gameSessionId}
    api-key: ${LOBBY_API_KEY:}
    public-key-location: ${LOBBY_PUBLIC_KEY_LOCATION}   # e.g. file:/secrets/lobby-public.pem
  security:
    demo-endpoints: false
    # Host logins: your Clerk PRODUCTION instance (keys pk_live_/sk_live_).
    clerk:
      issuer: ${CLERK_ISSUER}                       # e.g. https://clerk.yourdomain.com (Clerk dashboard > API keys)
      authorized-parties: ${JEOPARDY_PUBLIC_URL}    # only tokens issued to your Jeopardy site
