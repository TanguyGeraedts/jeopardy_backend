# Jeopardy running on THIS computer, using the lobby that runs online (lobby.geraedts.dev).
# Start with the "online-lobby" profile (logins still use your Clerk Development instance from application.yaml):
#   IntelliJ: Spring Boot run config -> Active profiles: online-lobby
#   CLI:      ./mvnw spring-boot:run -Dspring-boot.run.profiles=online-lobby
#
# Needs the ONLINE lobby's public key in secrets/lobby-public-online.pem (copy it from the VPS once):
#   scp <vps>:/opt/lobby/secrets/public.pem secrets/lobby-public-online.pem
#
# Players are sent from the online lobby to JEOPARDY_PUBLIC_URL/play/{id}. The default works for browser tabs on this
# computer. To join from phones, set JEOPARDY_PUBLIC_URL to this computer's address on your Wi-Fi, e.g.
# http://192.168.1.20:3000 (phones on the same Wi-Fi can open that; nobody on the internet can).
app:
  lobby:
    base-url: https://api.lobby.geraedts.dev
    launch-url: ${JEOPARDY_PUBLIC_URL:http://localhost:3000}/play/{gameSessionId}
    public-key-location: file:./secrets/lobby-public-online.pem
