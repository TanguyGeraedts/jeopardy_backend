name: Test, build and deploy

# Same pattern as the lobby repos:
# main -> tests, ghcr.io/<repo>:latest, then deployed to the VPS (deploy-jeopardy pulls BOTH Jeopardy images)
# dev  -> tests, ghcr.io/<repo>:dev (not deployed)
# PRs into main only test and build (no push); v* tags publish semver tags without deploying.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # JeopardyApplicationTests starts the whole app, so it needs a real Postgres (Flyway runs the migrations).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jeopardy
          POSTGRES_USER: jeopardy
          POSTGRES_PASSWORD: jeopardy_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeopardy" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      # Windows line endings / lost exec bit break the wrapper on Linux
      - run: sed -i 's/\r$//' mvnw && chmod +x mvnw

      - run: ./mvnw -B test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pulls the new image on the VPS and restarts Jeopardy. The SSH key can only run
  # /usr/local/bin/deploy-jeopardy (see the vps-infrastructure repo), nothing else.
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-jeopardy
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull and restart on the VPS
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo -n /usr/local/bin/deploy-jeopardy"
